name: build

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RTSPWallpaperStudio.sln --configfile NuGet.Config
      - run: dotnet build RTSPWallpaperStudio.sln -c Release -p:Platform=x64 --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            src/**/bin/x64/Release/**
            !src/**/obj/**
