name: test

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RTSPWallpaperStudio.sln --configfile NuGet.Config
      - run: dotnet test RTSPWallpaperStudio.sln -c Release -p:Platform=x64 --no-restore --logger "trx;LogFileName=test-results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
