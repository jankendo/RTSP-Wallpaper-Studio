name: release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RTSPWallpaperStudio.sln --configfile NuGet.Config
      - run: dotnet test RTSPWallpaperStudio.sln -c Release -p:Platform=x64 --no-restore
      - shell: pwsh
        run: .\installer\scripts\build-portable.ps1
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/portable/RTSPWallpaperStudio-win-x64.zip
            artifacts/portable/SHA256SUMS.txt
            THIRD-PARTY-NOTICES.txt
